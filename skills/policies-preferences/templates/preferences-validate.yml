# Written by `pp init`. Validates the policies & preferences instance on every change.
name: preferences-validate
on:
  push:
    paths: ["__HOME__/**", "__TOOLKIT__/**", "pp.config.yaml"]
  pull_request:
    paths: ["__HOME__/**", "__TOOLKIT__/**", "pp.config.yaml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q 'pyyaml>=6' 'jsonschema>=4.18'
      - run: PP_PYTHON=python __TOOLKIT__/bin/pp validate
      - run: PP_PYTHON=python __TOOLKIT__/test/run-tests.sh
      # Bot submissions (pp/* branches from pp-submit) may only propose preferences or add
      # feedback, unless the PR carries an owner decisions file. The owner's merge is the approval.
      - name: bot-safe change check
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'pp/')
        run: |
          git fetch -q origin "${{ github.base_ref }}"
          BASE="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          if git diff --name-only --diff-filter=A "$BASE" HEAD | grep -q '^__HOME__/decisions/'; then
            echo "Applies a decisions file; the owner reviews it in this PR."
          else
            PP_PYTHON=python __TOOLKIT__/bin/pp check-diff --base "$BASE"
          fi
