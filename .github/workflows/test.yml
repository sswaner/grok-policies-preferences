# Generic toolkit tests. This repo has no owner instance.
name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q 'pyyaml>=6' 'jsonschema>=4.18'
      - run: PP_PYTHON=python skills/policies-preferences/test/run-tests.sh
